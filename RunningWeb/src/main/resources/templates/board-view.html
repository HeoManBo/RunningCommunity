<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta id="_csrf" name="_csrf" th:content="${_csrf.token}"/>
  <meta id="_csrf_header" name="_csrf_header" th:content="${_csrf.headerName}"/>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
</head>
<body>
<header th:replace="~{fragment/header.html}"> </header>
<div class="container-sm" th:object="${boardViewDto}">
  <div class="card">
    <div class="card-header">
      <div class="d-flex justify-content-between align-items-center">
        <h3 th:text="*{title}">제목</h3>
        <div class="d-flex align-items-center">
          <div class="ml-auto">
            <!-- 자기가 작성한 게시글에만 삭제/수정버튼 보이게 하기 -->
            <div sec:authorize="isAuthenticated()">
              <a th:if="${#authentication.principal.member.username} == *{username}"
                      type="button" class="btn btn-sm btn-primary"
                      th:href="@{/board/modify/{boardId}(boardId = ${boardViewDto.boardId})}">수정</a>
              <button th:if="${#authentication.principal.member.username} == *{username}"
                 type="button" id="deleteBtn" class="btn btn-sm btn-danger mr-2">삭제</button>
            </div>
          </div>
          <span class="text-muted ml-2" th:text="*{writer}">작성자</span>
        </div>
      </div>
    </div>
    <div class="card-body">
      <p th:text="*{content}">내용</p>
      <div class="row">
        <div th:each="file : ${boardViewDto.getAttachFiles()}" class="col-md-6">
          <a th:if="${file.extractExt() == 'PNG' || file.extractExt() == 'JPG' || file.extractExt() == 'jpg' || file.extractExt() == 'png'}" class="d-block mb-2">
            <img id="img" th:src="@{|/attach/images/${file.serverFileName}|}" alt="이미지 로딩 실패" class="img-fluid" style="max-height: 500px; max-width: 500px;">
          </a>
          <a th:href="@{/file/{serverFileName}(serverFileName=${file.serverFileName})}" th:text="${file.originalName}" class="d-block">file_name</a>
        </div>
      </div>
    </div>
  </div>
  <!-- 댓글 작성 폼 -->
  <div class="card">
    <div class="card-body">
      <form id="comment-form" th:action="@{/comment/{boardId}(boardId  = ${boardViewDto.boardId})}" th:object="${commentDto}" method="post" >
        <div class="form-group">
          <label for="comment_content"></label>
          <textarea sec:authorize="isAuthenticated()" id="comment_content" type="text" th:field="*{content}" placeholder="댓글을 입력하세요"></textarea>
          <textarea sec:authorize="!isAuthenticated()" th:text="|로그인한 유저만 댓글 작성이 가능합니다.|" readonly></textarea>
        </div>
        <button sec:authorize="isAuthenticated()" type="submit" class="btn btn-primary">댓글 작성</button>
      </form>
    </div>
  </div>
  <div id="comment-list">
  </div>
  <button class="btn btn-primary" id='sse'></button>
</div>
<a class="btn btn-primary mt-2 ml-5" type="button" th:href="@{/main(page=${param.returnPage})}">
  목록으로
</a>
</body>

<script th:inline="javascript">
  var boardId = [[${boardViewDto.boardId}]]
  var userId = /*[[${loginId}]]*/ -1;
  var csrf_token = $("meta[name='_csrf']").attr("content");
  var csrf_header = $("meta[name='_csrf_header']").attr("content");
  var isAuthenticated = userId !== -1; //로그인 유무
  const port = [[${serverPort}]]

  const sseData = document.getElementById('sse');
  const eventSource = new EventSource(`http://localhost:${port}/connect/${boardId}`, {withCredentials: true, });
  var newCommentCount = 0;

  eventSource.addEventListener('count', (e) => {
    const {data : receivedConnectData} = e;
    sseData.style.display = 'block'
    newCommentCount += parseInt(receivedConnectData, 10);
    sseData.textContent = '신규 댓글 보기 ' + newCommentCount
    console.log('connect event data: ', receivedConnectData); //"connected!"
  })

  $("#sse").click(function () {
    sseData.style.display = 'none';
    newCommentCount = 0;
    loadComments();
  })

  $("#deleteBtn").click(function (){
    if(confirm("정말 삭제하시겠습니까?")){
      $.ajax({
        url: `/board/modify/${boardId}`,
        type: "delete",
        beforeSend: function(request){
          request.setRequestHeader(csrf_header, csrf_token)
        },
        success: function (){
          alert("게시물이 삭제되었습니다.");
          window.location.href="/main";
        },
        error: function (){
          alert("삭제에 실패했습니다.");
        }
      })
    }
  });

  function loadComments() {
    sseData.style.display = 'none';
    newCommentCount = 0;
    $.ajax({
      url: `/comment/${boardId}`,
      type: "get",
      success: renderComments,
      error: () => alert('댓글 로딩에 실패했습니다.')
    });
  }

  function renderComments(comments) {
    let commentList = $(`#comment-list`);
    commentList.empty();
    let commenthtml = comments.map(comment => createCommentHTML(comment)).join('');
    commentList.append(commenthtml);
    addEventListeners();
  }

  function createCommentHTML(comment, depth = 0) {
    const formattedDate = formatDate(comment.wroteAt);
    const isOwner = userId === comment.writer_id;
    const marginLeft = depth * 20; // 들여쓰기를 위한 마진 계산

    let html = `
    <div class="list-group-item" id="${comment.comment_id}" style="margin-left: ${marginLeft}px;">
      <div class="d-flex justify-content-between">
        <span>
          ${comment.writer}
          ${isOwner ? createOwnerButtons(comment.comment_id) : ''}
        </span>
        <small class="text-muted">${formattedDate}</small>
      </div>
      <p class="mt-2 comment-content" id="content-${comment.comment_id}">${comment.content}</p>
      ${isOwner ? createEditArea(comment) : ''}
                ${userId !== null ? `
              <button class="btn btn-sm btn-info replyBtn" data-comment-id="${comment.comment_id}">답글</button>
              <div class="reply-area" style="display:none;">
                <textarea class="form-control reply-textarea" placeholder="답글을 입력하세요"></textarea>
                <button class="btn btn-sm btn-primary mt-2 saveReplyBtn" data-comment-id="${comment.comment_id}">답글 저장</button>
                <button class="btn btn-sm btn-secondary mt-2 cancelReplyBtn">취소</button>
              </div>
            ` : ''}
    </div>
  `;

    // 대댓글 처리
    if (comment.child && comment.child.length > 0) {
      html += createChildCommentHTML(comment.child, depth + 1);
    }

    return html;
  }

  function createChildCommentHTML(childComments, depth) {
    let html = '';
    for (let childComment of childComments) {
      html += createCommentHTML(childComment, depth);
    }
    return html;
  }

  function formatDate(dateString) {
    const date = new Date(dateString);
    return `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}:${date.getSeconds().toString().padStart(2, '0')}`;
  }

  function createOwnerButtons(commentId) {
    return `
    <button class="btn btn-sm btn-danger deleteBtn" data-comment-id="${commentId}">삭제</button>
    <button class="btn btn-sm btn-warning editBtn" data-comment-id="${commentId}">수정</button>
  `;
  }

  function createEditArea(comment) {
    return `
    <div class="edit-area" style="display:none;">
      <textarea class="form-control edit-textarea">${comment.content}</textarea>
      <button class="btn btn-sm btn-primary mt-2 saveBtn" data-comment-id="${comment.comment_id}">저장</button>
      <button class="btn btn-sm btn-secondary mt-2 cancelBtn">취소</button>
    </div>
  `;
  }

  function addEventListeners() {
    $('.editBtn').on('click', handleEdit);
    $('.cancelBtn').on('click', handleCancel);
    $('.saveBtn').on('click', handleSave);
    $('.deleteBtn').on('click', handleDelete);
    $('.replyBtn').on('click', handleReplyClick);
    $('.cancelReplyBtn').on('click', handleReplyCancel);
    $('.saveReplyBtn').on('click', handleReplySave);
  }

  function handleReplyClick() {
    const commentId = $(this).data('comment-id');
    $(this).siblings('.reply-area').show();
  }

  function handleReplyCancel() {
    $(this).closest('.reply-area').hide();
  }

  function handleReplySave() {
    const commentId = $(this).data('comment-id');
    const replyContent = $(this).siblings('.reply-textarea').val();
    console.log(JSON.stringify({content:replyContent, parentId: commentId}))
    $.ajax({
      url: `/comment/${boardId}`,
      type: 'POST',
      beforeSend: function(request){
        request.setRequestHeader(csrf_header, csrf_token)
      },
      data: JSON.stringify({
        content: replyContent,
        parentId: commentId
      }),
      contentType: 'application/json',
      success: function(){
        loadComments(); // 댓글 재갱신
        $('.reply-area').hide();
        $('.reply-textarea').val('');
      },
      error: function(request, status, error){
        alert("code:"+ request.status+"\n"+"message:"+request.responseText+"\n"+"error:"+error);
      }
    });
  }

  function handleEdit() {
    const commentId = $(this).data('comment-id');
    $(`#content-${commentId}`).hide();
    $(this).closest('.list-group-item').find('.edit-area').show();
  }

  function handleCancel() {
    const editArea = $(this).closest('.edit-area');
    editArea.hide();
    editArea.siblings('.comment-content').show();
  }

  function handleSave() {
    const commentId = $(this).data('comment-id');
    const newContent = $(this).siblings('.edit-textarea').val();
    const $commentItem = $(this).closest('.list-group-item');

    $.ajax({
      url: `/comment/${commentId}`,
      type: 'PUT',
      contentType: 'application/json',
      data: JSON.stringify({ updateComment: newContent }),
      beforeSend: function(request) {
        request.setRequestHeader(csrf_header, csrf_token);
      },
      success: function(response) {
        $commentItem.find(`#content-${commentId}`).text(newContent).show();
        $commentItem.find('.edit-area').hide();
      },
      error: () => alert('댓글 수정에 실패했습니다.')
    });
  }

  function handleDelete() {
    const commentId = $(this).data('comment-id');
    if (confirm('정말로 이 댓글을 삭제하시겠습니까?')) {
      $.ajax({
        url: `/comment/${commentId}`,
        type: 'DELETE',
        beforeSend: function(request) {
          request.setRequestHeader(csrf_header, csrf_token);
        },
        success: loadComments,
        error: () => alert('댓글 삭제에 실패했습니다.')
      });
    }
  }

  $('#comment-form').submit(function(event){
    event.preventDefault(); // 폼 제출 기본 동작 방지

    let content = $('#comment_content').val(); // 보낼 댓글 내용
    console.log(content);
    console.log(JSON.stringify({content: content})) // JSON 화

    $.ajax({
      url: `/comment/${boardId}`,
      type: 'POST',
      beforeSend: function(request){
        request.setRequestHeader(csrf_header, csrf_token)
      },
      data: JSON.stringify({content: content, parentId:-1}),
      contentType: 'application/json',
      success: function(){
        loadComments(); //댓글 재갱신
        $('#comment_content').val('');
      },
      error: function(){
        alert("code:"+ request.status+"\n"+"message:"+request.responseText+"\n"+"error:"+error);
      }
    })
  })

  window.addEventListener('DOMContentLoaded', function (){
    loadComments(); // 페이지 로드 시 댓글 불러오기
  });

</script>

</html>
