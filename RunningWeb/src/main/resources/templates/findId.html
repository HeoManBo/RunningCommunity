<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragment/layout.html}">
<head>
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta charset="UTF-8">
  <title th:text="|아이디 찾기|"></title>

</head>
<body>
<th:block layout:fragment="content">
  <div class="container pt-5">
    <h2>가입하실 때 입력하신 이메일을 입력해주세요. </h2>
    <label for="email">아이디 찾기시 사용할 이메일</label>
    <div class="input-group">
      <input type="email" class="form-control" id="email" name="email" placeholder="이메일을 입력하세요" required>
      <div class="input-group-append">
        <button type="button" class="btn btn-secondary" id="sendVerification">인증 메일 발송</button>
      </div>
    </div>
    <div class="form-group" id="verificationGroup" style="display: none;">
      <label for="verificationCode">인증 번호</label>
      <div class="input-group">
        <input type="text" class="form-control" id="verificationCode" name="verificationCode" placeholder="인증 번호를 입력하세요">
        <div class="input-group-append">
          <button type="button" class="btn btn-secondary" id="verifyCode">확인</button>
        </div>
      </div>
    </div>
    <div id="result">
      <h2 id="findId" style="display: none"></h2>
    </div>
  </div>

  <script>
    // CSRF 토큰 설정
    var header = $("meta[name='_csrf_header']").attr('content');
    var token = $("meta[name='_csrf']").attr('content');

    $(document).ready(function() {
      // 인증 메일 발송 버튼 클릭 시 이벤트
      $('#sendVerification').click(function() {
        var email = $('#email').val();
        $.ajax({
          url: '/findId',
          type: 'POST',
          beforeSend: function(xhr){
            xhr.setRequestHeader(header, token);
          },
          data: {
            email: email
          },
          success: function(response) {
            alert('인증 메일이 발송되었습니다.');
            $('#verificationGroup').show();
          },
          error: function(xhr, status, error) {
            alert('인증 메일 발송에 실패했습니다. 다시 시도해주세요.');
          }
        });
      });

      // 인증 코드 확인 버튼 클릭 시 이벤트
      $('#verifyCode').click(function() {
        var code = $('#verificationCode').val();
        var email = $('#email').val();
        $.ajax({
          url: '/findId/check',
          type: 'GET',
          beforeSend: function(xhr){
            xhr.setRequestHeader(header, token);
          },
          data: {
            code: code,
            email: email
          },
          success: function (response) {
            console.log(response.nickname);
            $('<h1>').text(response.nickname).appendTo($('#result'));
          },
          error: function(xhr, status, error) {
            alert('인증 확인 중 오류가 발생했습니다. 다시 시도해주세요.');
          }
        });
      });

      // 폼 제출 시 이메일 인증 확인
      $('form').submit(function(e) {
        if (!isEmailVerified) {
          e.preventDefault();
          alert('이메일 인증을 완료해주세요.');
        }
      });
    });
  </script>
</th:block>
</body>
</html>
